name: CI — Build & Typecheck

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Next.js (apps/nextjs) ────────────────────────────────────────────────
  nextjs:
    name: Next.js — Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace=apps/nextjs

      - name: Lint
        run: npm run lint --workspace=apps/nextjs

      - name: Build
        run: npm run build --workspace=apps/nextjs
        env:
          # Build-time placeholders — real values are injected by Vercel at deploy time.
          # These must be non-empty strings to prevent module-load errors.
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder"
          SUPABASE_SERVICE_ROLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder"
          RAZORPAY_KEY_ID: "rzp_test_placeholder"
          RAZORPAY_KEY_SECRET: "placeholder_secret"
          RAZORPAY_WEBHOOK_SECRET: "placeholder_webhook_secret"

  # ─── Express API (apps/api) ───────────────────────────────────────────────
  api:
    name: API — Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace=apps/api

      - name: Build
        run: npm run build --workspace=apps/api
